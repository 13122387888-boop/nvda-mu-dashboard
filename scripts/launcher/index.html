<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="launcher-token" content="__LAUNCHER_TOKEN__" />
    <title>EOD Radar · 数据启动器</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <span class="brand">EOD RADAR</span
        ><span class="local">本机启动器</span>
      </header>
      <section class="hero">
        <p class="eyebrow">收盘以后，一键更新</p>
        <h1>每天的研究，<br />从最新数据开始。</h1>
        <p>长桥行情 · 整批校验 · 股票与指标同步更新</p>
      </section>
      <section class="status-card">
        <div><span>线上数据日期</span><strong id="date">正在检查…</strong></div>
        <div><span>已更新代码</span><strong id="count">—</strong></div>
        <button id="check" class="subtle" type="button">检查状态 ↻</button>
      </section>
      <section class="actions">
        <button id="refresh" class="primary" type="button">
          刷新数据 <span>↻</span></button
        ><a
          class="secondary"
          href="https://eodradar.com/"
          target="_blank"
          rel="noreferrer"
          >打开正式网站 ↗</a
        >
      </section>
      <p class="hint">
        刷新时请保持电脑联网，通常需要 1–3 分钟。完成后网站缓存最多约 5
        分钟更新。
      </p>
      <section class="progress">
        <div class="progress-heading">
          <h2 id="phase">准备就绪</h2>
          <span id="result">点击“刷新数据”开始</span>
        </div>
        <div id="activity" class="activity" aria-live="polite">
          <span></span>
        </div>
        <div id="logs" role="log" aria-label="刷新记录">
          <p>刷新会自动选择最近已完整收盘的美股交易日。</p>
        </div>
      </section>
      <footer>本机负责采集，正式网站负责展示。此启动器无需输入密码。</footer>
    </main>
  </body>
</html>
