name: Production health smoke
on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 2-6"
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || secrets.PRODUCTION_BASE_URL }}
    steps:
      - name: Check Longbridge coverage and freshness
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.PRODUCTION_BASE_URL;
          if (!base || !/^https:\/\//.test(base)) throw new Error('Configure PRODUCTION_BASE_URL');
          const response = await fetch(new URL('/api/health', base));
          const h = await response.json();
          if (!response.ok || h.database !== 'connected' || h.source !== 'LONGBRIDGE' || h.status !== 'ok' || h.currentStockSymbols !== h.expectedSymbols) {
            throw new Error('Longbridge health failed: ' + JSON.stringify(h));
          }
          console.log('Longbridge coverage verified', h.asOf, h.currentStockSymbols);
          NODE
